# =============================================================================
# PowerShell Format and Deploy Dry-Run CI Workflow
# =============================================================================
# Formatting and deployment checks (lint and tests live in ci.yml):
# - Formatting validation (indentation, BOM, trailing whitespace, line length)
#
# Triggers: Push to main, PRs, and manual dispatch
# =============================================================================

name: PowerShell Format & Deploy Dry-Run

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**.ps1"
      - "**.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - "install.conf.yaml"
      - ".github/workflows/lint-format-test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.ps1"
      - "**.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/lint-format-test.yml"

# Cancel in-progress runs for the same workflow + ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Formatting validation
  # ===========================================================================
  format:
    name: PowerShell Format Check
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run formatting check
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'

          # Get changed files
          $baseRef = 'main'
          if ($env:GITHUB_BASE_REF) { $baseRef = $env:GITHUB_BASE_REF }
          git fetch origin "refs/heads/$baseRef" --depth=1 2>$null
          $changedFiles = @(git diff --name-only --diff-filter=ACM "origin/$baseRef" HEAD | Where-Object { $_ -match '\.(ps1|psm1|psd1)$' })

          $psFiles = @()
          foreach ($f in $changedFiles) {
              if (Test-Path $f) {
                  $psFiles += Get-Item $f
              }
          }
          $issues = @()
          $MaxLineLength = 500

          if ($psFiles.Count -eq 0) {
            Write-Host "## No formatting issues found" -ForegroundColor Green
            exit(0) # obfuscated
          }

          foreach ($file in $psFiles) {
            # Skip files in ignored directories
            if ($file.FullName -match 'node_modules|\.git|user|\.dotfiles') { continue }

            # Read as bytes to check BOM
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)

            # Read content
            $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.UTF8Encoding]::new($true))
            $lines = $content -split "\r?\n"

            # Check 1: UTF-8 BOM
            if ($bytes.Count -ge 3) {
              $bom = [System.Text.Encoding]::UTF8.GetPreamble()
              $hasBom = $true
              for ($i = 0; $i -lt $bom.Length; $i++) {
                if ($bytes[$i] -ne $bom[$i]) { $hasBom = $false; break }
              }
              if (-not $hasBom) {
                $issues += "[$($file.Name)]: Missing UTF-8 BOM"
              }
            } else {
              $issues += "[$($file.Name)]: Missing UTF-8 BOM"
            }

            # Check 2: Indentation
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              if ([string]::IsNullOrWhiteSpace($line)) { continue }

              # Check for tabs
              if ($line -match '^\t') {
                $issues += "[$($file.Name)]:$($i+1): Line uses tabs instead of spaces"
              }

              # Check indentation is multiple of 2
              if ($line -match '^(\s+)') {
                $spaces = $matches[1].Length
                if ($spaces % 2 -ne 0 -and $line -notmatch '^\s*#') {
                  $issues += "[$($file.Name)]:$($i+1): Indentation not multiple of 2 spaces"
                }
              }
            }

            # Check 3: Trailing whitespace
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              $trimmedLine = $line.TrimEnd()
              if ($trimmedLine -ne '' -and $trimmedLine -match '\s+$') {
                $issues += "[$($file.Name)]:$($i+1): Trailing whitespace"
              }
            }

            # Check 4: Max line length
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -match '^\s*#') { continue }
              if ($line.Length -gt $MaxLineLength) {
                $issues += "[$($file.Name)]:$($i+1): Line exceeds $MaxLineLength characters ($($line.Length))"
              }
            }
          }

          if ($issues.Count -gt 0) {
            Write-Host "## Formatting Issues Found ($($issues.Count))" -ForegroundColor Red
            $issues | ForEach-Object { Write-Host $_ -ForegroundColor Yellow }
            exit 1
          } else {
            Write-Host "## No formatting issues found" -ForegroundColor Green
            exit 0
          }

  # ===========================================================================
  # Job 2: Dotbot deployment dry-run integration test
  # ===========================================================================
  deploy-dry-run:
    name: Dotbot Deployment -WhatIf
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Setup-Dotfiles.ps1 with -WhatIf for all targets
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'
          pwsh -NoProfile -File Scripts/Setup-Dotfiles.ps1 -WhatIf -SkipWingetTools 2>&1 | ForEach-Object { Write-Host $_ }
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "## Deployment -WhatIf failed with exit code $exitCode" -ForegroundColor Red
            exit 1
          }
          Write-Host "## Deployment -WhatIf completed successfully" -ForegroundColor Green
          exit 0

  # ===========================================================================
  # Summary job - always runs after others
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: windows-latest
    timeout-minutes: 5
    needs: [format, deploy-dry-run]
    if: always()
    permissions: {}
    env:
      FORMAT_RESULT: ${{ needs.format.result }}
      DEPLOY_RESULT: ${{ needs.deploy-dry-run.result }}
    steps:
      - name: Summary
        shell: bash
        run: |
          status() { [ "$1" = success ] && echo '✅ Success' || echo '❌ Failed'; }
          {
            echo "## PowerShell CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|------|--------|"
            echo "| Format | $(status "$FORMAT_RESULT") |"
            echo "| Deploy Dry-Run | $(status "$DEPLOY_RESULT") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FORMAT_RESULT" = failure ] || [ "$DEPLOY_RESULT" = failure ]; then
            echo "### :x: Some checks failed. Please review the logs above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### :white_check_mark: All checks passed!" >> "$GITHUB_STEP_SUMMARY"
