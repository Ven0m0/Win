# =============================================================================
# CI - lint and full Pester suite
# =============================================================================
# Runs on every push to main and every PR regardless of which files changed,
# so the gate is always present on the merge button.
#
# Jobs:
#   1. lint - PSScriptAnalyzer over all .ps1/.psm1/.psd1 files; fail on Error/Warning
#   2. test - every tests/*.Tests.ps1 file; results published as check annotations
#
# Formatting and the dotbot dry-run live in lint-format-test.yml.
# =============================================================================

name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: PSScriptAnalyzer
  # ===========================================================================
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PowerShell
        uses: ./.github/actions/setup-pwsh

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'

          $settingsFile = if (Test-Path 'PSScriptAnalyzerSettings.psd1') { 'PSScriptAnalyzerSettings.psd1' } else { $null }

          $psFiles = Get-ChildItem -Recurse -Include '*.ps1','*.psm1','*.psd1' -File |
            Where-Object { $_.FullName -notmatch '\\(node_modules|\.git|user|\.dotfiles)\\' }

          Write-Host "Analyzing $($psFiles.Count) file(s)..."

          # Community rules from the PowerShell Gallery; the settings file names the rules to run.
          Install-Module Indented.ScriptAnalyzerRules -Scope CurrentUser -Force

          # OptimizationRules is only published on a personal MyGet feed (not the Gallery), so pin the version.
          # A feed outage must not fail the build: skip the pack and lint without its rule.
          $ruleModules = @('Indented.ScriptAnalyzerRules')
          try {
            Register-PSRepository -Name ottomatt -SourceLocation 'https://www.myget.org/F/ottomatt/api/v2' `
              -InstallationPolicy Trusted -ErrorAction Stop
            Install-Module OptimizationRules -RequiredVersion 0.4.0 -Repository ottomatt -Scope CurrentUser `
              -Force -ErrorAction Stop
            $ruleModules += 'OptimizationRules'
          } catch {
            $err = $_
            Write-Host "::warning::OptimizationRules unavailable, skipping Measure-OptimizeForStatement: $($err.Exception.Message)"
          }

          $ruleFiles = foreach ($name in $ruleModules) {
            $module = Get-Module -ListAvailable $name | Select-Object -First 1
            Join-Path $module.ModuleBase "$name.psm1"
          }

          $params = @{ CustomRulePath = @($ruleFiles) }
          if ($settingsFile) { $params['Settings'] = $settingsFile }
          if ($ruleModules -notcontains 'OptimizationRules') { $params['ExcludeRule'] = 'Measure-OptimizeForStatement' }

          # -Path takes a single string: passing the whole array errors out and used to leave the results empty.
          $results = foreach ($file in $psFiles.FullName) {
            Invoke-ScriptAnalyzer -Path $file @params -ErrorAction Continue
          }
          $issues  = @($results | Where-Object { $_.Severity -in 'Error','Warning','ParseError' })

          # Emit GitHub workflow annotations
          foreach ($r in $issues) {
            $rel = ($r.ScriptPath -replace [regex]::Escape($PWD.Path + '\'), '') -replace '\\','/'
            $lvl = if ($r.Severity -in 'Error','ParseError') { 'error' } else { 'warning' }
            Write-Host "::$lvl file=$rel,line=$($r.Line),col=$($r.Column)::[$($r.RuleName)] $($r.Message)"
          }

          if ($issues.Count -gt 0) {
            Write-Host ""
            Write-Host "$($issues.Count) issue(s) found (Error: $(($issues | Where-Object Severity -eq 'Error').Count), Warning: $(($issues | Where-Object Severity -eq 'Warning').Count))"
            exit 1
          }

          Write-Host "No PSScriptAnalyzer errors or warnings"

  # ===========================================================================
  # Job 2: Pester tests
  # ===========================================================================
  test:
    name: Pester Tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # dorny/test-reporter reads the workflow run
      checks: write # dorny/test-reporter posts the check run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PowerShell
        uses: ./.github/actions/setup-pwsh
        with:
          pester-min-version: 5.6.0

      - name: Run all Pester tests
        shell: pwsh
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: |
          # No Set-StrictMode here: pwsh steps are dot-sourced, so it would leak into every test.
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'pester-results.xml'

          $result = Invoke-Pester -Configuration $config

          if (-not $result) {
            Write-Host "::error::Pester returned no result object (crash or timeout)"
            exit 1
          }

          Write-Host ""
          Write-Host "Passed:  $($result.PassedCount)"
          Write-Host "Failed:  $($result.FailedCount)"
          Write-Host "Skipped: $($result.SkippedCount)"
          Write-Host "Total:   $($result.TotalCount)"

          if ($result.FailedCount -gt 0) {
            exit 1
          }

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Pester Results
          path: pester-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: pester-results.xml
          retention-days: 14
