# https://mise.jdx.dev/configuration.html
[settings]
color = true
yes = true
auto_install = true
go_skip_checksum = true

[settings.python]
uv_venv_auto = "create|source"
#uv_venv_create_args = ["--seed", "--system-site-packages"]
github_attestations = false

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "bun"

[settings.dotnet]
cli_telemetry_optout = true

[tools]
# dotbot is not installed here: the deploy task runs it through uvx, pinned to one version.

[env]
# PROJECT_ROOT = "{{config_root}}"
# "symlink" left venvs as dangling links once `uv cache prune` ran; hardlinks survive it and need no privileges.
UV_LINK_MODE = "hardlink"
# _.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed", "--system-site-packages"] }
DO_NOT_TRACK = "1"
NODE_NO_WARNINGS = "1"
PYTHONOPTIMIZE = "1"
CARGO_NET_GIT_FETCH_WITH_CLI = "false"
CARGO_HTTP_MULTIPLEXING = "true"
BINSTALL_DISABLE_TELEMETRY = "true"

#[hooks]
#enter = "mise i -yq"

[tasks.deploy]
description = "Deploy dotfiles (dotbot runs via uvx, no install step)"
alias = "bootstrap"
run = "uvx --from dotbot==1.24.1 dotbot -c install.conf.yaml"
